default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^packages/harness/tests/golden/
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy packages capture/src
        language: system
        types_or: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: ui-prettier
        name: prettier (ui)
        entry: >-
          sh -c 'cd ui && for f in "$@"; do set -- "$@" "${f#ui/}"; shift; done;
          exec npm exec --no -- prettier --check "$@"' prettier
        language: system
        files: ^ui/
        exclude: ^ui/(package-lock\.json|mock/fixtures/(config|schema|codes)\.json)$
      - id: ui-eslint
        name: eslint (ui)
        entry: npm --prefix ui exec --no -- eslint --no-warn-ignored
        language: system
        files: ^ui/.*\.(ts|js|svelte)$
