# One recorder container for both the laptop shakedown and the NAS long run.
# Only the env file differs:
#   ENV_FILE=.env.local    docker compose up -d      # dev broker on this machine
#   ENV_FILE=.env.nas      docker compose up -d      # live broker, weeks-long
# Discovery (short, exits by itself, no restart policy):
#   docker compose run --rm -e TOPICS='#' -e CAPTURE_NAME=discovery -e MAX_HOURS=2 recorder
services:
  recorder:
    image: climate-manager-recorder:latest
    build: .
    container_name: climate-manager-recorder
    env_file: ${ENV_FILE:-.env}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./captures:/captures
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /captures -maxdepth 2 -name .heartbeat -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
