[project]
name = "climate-manager-capture"
version = "0.1.0"
description = "Record live HeishaMon MQTT traffic and replay it into the climate_manager dev stack"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Dennis Bakhuis" }]
dependencies = [
    "paho-mqtt>=2.1",
]

[project.scripts]
climate-manager-record = "climate_manager_capture.record:main"
climate-manager-replay = "climate_manager_capture.replay:main"
climate-manager-capture-info = "climate_manager_capture.capture_info:main"
climate-manager-capture-synthetic = "climate_manager_capture.synthetic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_manager_capture"]
