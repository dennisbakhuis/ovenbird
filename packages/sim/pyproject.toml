[project]
name = "ovenbird-sim"
version = "0.4.1"
description = "Model fitting, open-loop run and simulation tooling for ovenbird."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Dennis Bakhuis" }]
dependencies = [
    "ovenbird-core",
    "climate-manager-capture",
    "numpy>=2.3",
    "scipy>=1.16",
    "pyarrow>=22",
    "aiomqtt>=2.5.1",
]

[tool.uv.sources]
ovenbird-core = { workspace = true }
climate-manager-capture = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovenbird_sim"]

[dependency-groups]
dev = ["scipy-stubs>=1.16", "pyarrow-stubs>=20"]
