[project]
name = "ovenbird"
version = "0.5.0"
description = "Asyncio service that runs the ovenbird heat pump controller."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Dennis Bakhuis" }]
dependencies = [
    "aiomqtt>=2.5.1",
    "fastapi>=0.162.7",
    "ovenbird-core",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
learner = ["ovenbird-sim"]

[project.scripts]
ovenbird = "ovenbird.__main__:main"

[tool.uv.sources]
ovenbird-core = { workspace = true }
ovenbird-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovenbird"]
exclude = ["src/ovenbird/testing.py"]
