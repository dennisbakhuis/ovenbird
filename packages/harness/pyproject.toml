[project]
name = "ovenbird-harness"
version = "0.6.0"
description = "Fast closed-loop runs of the whole ovenbird service against the simulated plant."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Dennis Bakhuis" }]
dependencies = [
    "ovenbird-core",
    "ovenbird",
    "ovenbird-sim",
    "aiomqtt>=2.5.1",
    "numpy>=2.3",
]

[tool.uv.sources]
ovenbird-core = { workspace = true }
ovenbird = { workspace = true }
ovenbird-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovenbird_harness"]
